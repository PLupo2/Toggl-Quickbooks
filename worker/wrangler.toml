name = "timesync-api-proxy"
main = "src/index.js"
compatibility_date = "2026-07-13"

account_id = "3a90eb4c3c67a40a1c4432b4dffc774d"

# Routes /api/* on the existing (proxied) zone to this Worker. Everything
# else on the domain continues to be served by GitHub Pages — this Worker
# does not host or proxy the frontend.
routes = [
  { pattern = "timesync.pltheatrical.com/api/*", zone_id = "f8560ea50c7d4be88bc51ebfd022c1ea" }
]

# Non-secret config. Secrets (WEB_API_KEY, WORKER_SECRET) are NOT set here —
# set them with `wrangler secret put <NAME>` so they never land in this file
# or git history.
[vars]
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSEAEDqOrmBvgKhhxvHTkNwbbvY9ss_w3CsWr625al3scJg_nqKgNGPASqHRyMxska/exec"
